<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>חותרים כברק 2026 — תודה</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Arial', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 600px;
      overflow: hidden;
      text-align: center;
    }
    .hero-img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      display: block;
    }
    .content {
      padding: 60px 40px;
    }
    h1 {
      font-size: 32px;
      color: #1a3a52;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    p {
      font-size: 18px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .heart {
      font-size: 40px;
      margin: 20px 0;
    }
    .footer-text {
      font-size: 14px;
      color: #999;
      margin-top: 40px;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="images/logo.jpg" alt="חותרים כברק" class="hero-img">
    <div class="content">
      <h1>האירוע הסתיים והיה נפלא</h1>
      <div class="heart">💙</div>
      <p>תודה רבה על השתתפותכם בחותרים כברק 2026</p>
      <p>לזכרו של ברק לופן ז״ל</p>
      <p style="font-size: 20px; color: #1a3a52; font-weight: bold;">מחכים לכם גם בשנה הבאה</p>
      <div class="footer-text">
        <p>קיבוץ גנוסר | 5 ביוני 2026</p>
      </div>
    </div>
  </div>
</body>
</html>
